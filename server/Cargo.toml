[package]
name = "blindtest-server"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4"
actix-cors = "0.7"
actix-rt = "2"
actix-ws = "0.3"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
jsonwebtoken = "9"
bcrypt = "0.15"
uuid = { version = "1", features = ["v4"] }
strsim = "0.11"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
zip = "0.6"
rsa = "0.9"
base64 = "0.22"
log = "0.4"
env_logger = "0.11"
bytestring = "1"
futures-util = "0.3"
