[package]
name = "blindtest-server"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4"
actix-cors = "0.7"
actix-rt = "2"
actix-ws = "0.4"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.39", features = ["bundled"] }
jsonwebtoken = { version = "10", features = ["use_pem", "rust_crypto"] }
bcrypt = "0.19"
uuid = { version = "1", features = ["v4"] }
strsim = "0.11"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.10"
zip = "8.6"
base64 = "0.22"
log = "0.4"
env_logger = "0.11"
bytestring = "1"
futures-util = "0.3"
rust-s3 = "0.37"
