services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: blindtest-server
    env_file: .env
    ports:
      - "3080:80"
    volumes:
      - ./server/secret:/app/secret:ro
      - ./server/data:/app/data
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: blindtest-client
    env_file: .env
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - ORIGIN=http://localhost:3000
    depends_on:
      - server
    restart: unless-stopped


