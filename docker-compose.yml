services:
  rustfs:
    image: rustfs/rustfs:latest
    container_name: blindtest-rustfs
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./rustfs_data:/data
    restart: unless-stopped
    command: server /data

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: blindtest-server
    env_file: .env
    environment:
      - S3_ENDPOINT=http://rustfs:9000
      - S3_ACCESS_KEY=rustfsadmin
      - S3_SECRET_KEY=rustfsadmin
      - S3_BUCKET=blindtest
      - S3_REGION=us-east-1
    ports:
      - "3080:80"
    volumes:
      - ./server/secret:/app/secret:ro
      - ./server/data:/app/data
      - ./server/cookies.txt:/app/cookies.txt:ro
    depends_on:
      - rustfs
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL}
        - VITE_WS_URL=${VITE_WS_URL}
    container_name: blindtest-client
    env_file: .env
    ports:
      - "3000:3000"
    depends_on:
      - server
    restart: unless-stopped


