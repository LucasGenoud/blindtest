services:
  seaweedfs:
    image: chrislusf/seaweedfs
    container_name: seaweedfs
    ports:
      - "9333:9333"
      - "8333:8333"
      - "8080:8080"
      - "18080:18080"
      - "23646:23646"
    volumes:
      - ./seaweed_data:/data
    environment:
      - AWS_ACCESS_KEY_ID=${SEAWEEDFS_ACCESS_KEY}
      - AWS_SECRET_ACCESS_KEY=${SEAWEEDFS_SECRET_KEY}
      - S3_BUCKET=${SEAWEEDFS_DEFAULT_BUCKET}
    networks:
      - pangolin
    restart: unless-stopped

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: blindtest-server
    env_file: .env
    environment:
      - S3_ENDPOINT=${SERVER_S3_ENDPOINT}
      - S3_ACCESS_KEY=${SERVER_S3_ACCESS_KEY}
      - S3_SECRET_KEY=${SERVER_S3_SECRET_KEY}
      - S3_BUCKET=${SERVER_S3_BUCKET}
      - S3_REGION=${SERVER_S3_REGION}
    ports:
      - "3080:80"
    volumes:
      - ./server/secret:/app/secret:ro
      - ./server/data:/app/data
      - ./server/cookies.txt:/app/cookies.txt
    depends_on:
      - seaweedfs
    networks:
      - pangolin
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL}
        - VITE_WS_URL=${VITE_WS_URL}
    container_name: blindtest-client
    env_file: .env
    ports:
      - "3000:3000"
    depends_on:
      - server
    networks:
      - pangolin
    restart: unless-stopped

networks:
  pangolin:
    external: true
